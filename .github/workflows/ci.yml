name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talent_db
          POSTGRES_USER: talent
          POSTGRES_PASSWORD: talent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Lint and format check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://talent:talent@localhost:5432/talent_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-key-for-ci-runs
          DEBUG: "True"
        run: |
          cd backend
          pytest --cov=apps -q
